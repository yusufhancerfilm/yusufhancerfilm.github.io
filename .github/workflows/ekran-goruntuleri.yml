name: Ekran görüntüleri
on:
  push:
    branches: [ciktilar]
    paths: ['tools/**', '.github/workflows/**']
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ciktilar, sparse-checkout: 'tools', sparse-checkout-cone-mode: true }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tools/shoot.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git sparse-checkout disable || true
          git add screenshots
          git commit -m "Ekran görüntüleri"
          git push origin ciktilar
